# services/api — authoritative API-only dependency lock (P8, D-22).
#
# Fully pinned (==) transitive closure of requirements-api.in, for the FastAPI read layer ONLY.
# This is what services/api/requirements.txt installs, and what Render builds from:
#
#     python -m pip install --requirement requirements-api.lock
#
# 21 packages against the root lock's 54. It excludes vnstock and vnstock's mandatory closure
# (pandas, numpy, matplotlib, seaborn, wordcloud, pillow, openpyxl) — none of which any path in
# services/api/app imports, and all of which a metered deployment build would otherwise install
# on every push. Reasoning and the alternatives in docs/decisions/D-22-split-api-dependency-
# manifest.md.
#
# Authoritatively generated on **Debian-slim-based Linux x86_64** (python:3.13-slim, glibc, cp313
# manylinux ABI) via a disposable Docker container, so the Linux-only closure (uvloop, httptools
# for uvicorn[standard]) is included and Windows-only packages are excluded. A Windows-resolved
# lock is NOT authoritative. Generated 2026-08-18 (P8.1).
#
# COMPILED UNDER --constraint requirements.lock, AND THAT FLAG IS NOT OPTIONAL. Without it the
# resolver takes the newest release satisfying requirements-api.in, which on first attempt gave
# starlette 1.6.0 / uvicorn 0.52.3 / pydantic-settings 2.15.0 against the root lock's 1.3.1 /
# 0.51.0 / 2.14.2 — a deployment running a different FastAPI stack than local development, with
# nothing to surface the difference. Under the constraint this file is a strict subset of
# requirements.lock, version for version, and the only thing that can drift between the two is
# the package LIST in requirements-api.in.
#
# Regenerate (never hand-edit the pins) after changing requirements-api.in, in a fresh disposable
# Linux environment with the exact interpreter and the exact ephemeral compiler:
#     docker run --rm --platform linux/amd64 -v "<repo>:/work" python:3.13-slim bash -c '
#         pip install -q "pip==24.3.1" "pip-tools==7.5.3"
#         python -m piptools compile --resolver=backtracking --no-header #             --constraint /work/requirements.lock #             --output-file /work/requirements-api.lock /work/requirements-api.in'
# (pip-tools 7.5.3 imports a pip-internal symbol pip>=25 removed, so pip is pinned down for the
# compile step only — the pin does not propagate into this lock file.)
#
# Verified as a strict subset: 21/21 pins present in requirements.lock at identical versions,
# 0 mismatches, 0 of the heavy packages.
