# Render Blueprint — both halves of the deployment, one provider, one file.
#
# Declared here rather than clicked together in Render's dashboard because configuration
# assembled by hand is configuration nothing can reproduce. A thesis defence should be able to
# rebuild the deployment from the repository, and a reviewer should be able to read what the
# deployment is without being given an account.
#
# THIS FILE CONTAINS NO SECRET, and must not. `DATABASE_URL` holds the Supabase `postgres`
# password and `ALLOWED_ORIGINS` names the other service's origin; both are marked `sync: false`,
# which tells Render to prompt for them once and keep them in the dashboard instead of reading
# them from here.
#
# BACK TO ONE PROVIDER (P15) — what changed and why
# --------------------------------------------------
# D-30 split the dashboard onto Netlify; this file only ever declared the API. P15 reverses that:
# both services are declared here again, on Render, in one file. See
# docs/decisions/D-31-single-provider-and-derived-storage.md for the full reasoning — in short,
# the two-provider split bought nothing this deployment used (no build-minute pressure, no
# deploy-preview workflow) and cost a cross-reference that could only ever be closed by hand: the
# site had to be BUILT with the API's URL and the API had to be CONFIGURED with the site's origin
# before CORS would admit it, each a separate manual step after the other deployed.
#
# THAT LOOP IS MOSTLY GONE, not just moved. The static site's `routes` rewrite below proxies
# `/api/*` to the API service, so the browser only ever calls its own origin — `apps/web` is built
# with `NEXT_PUBLIC_API_BASE_URL=/`, a fixed value that names no service and therefore needs no
# manual step after either deploy. `ALLOWED_ORIGINS` on the API is kept anyway, `sync: false`,
# as the fallback for the one thing not yet verified against a real Render Static Site: whether
# its rewrite can proxy to another Render service's *.onrender.com host, or only within its own
# origin. If it can't, requests fall back to a real cross-origin call and CORS is what admits it.
#
# STATIC SITE, NOT A SECOND WEB SERVICE — D-21's argument, unchanged
# -------------------------------------------------------------------
# A Web Service serving static files can spin down, so a visitor arriving cold would wait for the
# HTML itself before any request to the API was even issued. A Static Site is always instant and
# only the data behind it can be slow. Nothing about that argument depended on the provider, so
# moving the dashboard back to Render changes the provider, not the shape.
#
# The other half of D-21's cold-start problem — the API itself sleeping on the free plan — is
# fixed differently this time: `plan: starter` below buys *not sleeping*, not capacity. Measured
# RSS on this service is 65-74 MB against a 512 MB limit on both plans; Starter was never about
# running out of room.

services:
  # ---------------------------------------------------------------------------
  # FastAPI read layer. Reads Supabase as `postgres` — after D-20 that is the
  # only path to the data; anon/authenticated hold no grants at all.
  # ---------------------------------------------------------------------------
  - type: web
    name: anchor-model-api
    runtime: python
    # P15 decision #6: Starter, not free. The free plan's ~15-minute spin-down turns "open the
    # link in front of a committee" into a minute of nothing — the single row Validation weighs
    # heaviest (#13). $7/mo buys availability, not headroom the service doesn't need.
    plan: starter
    # Closest region to the Supabase project. As of P15 that project is Singapore
    # (ap-southeast-1) too — see the migration note below — so this is no longer merely the
    # nearest available region, it is the SAME region, and the extra network leg D-21 already
    # accepted is gone.
    # Valid values: oregon (default), ohio, virginia, frankfurt, singapore.
    region: singapore

    # LOAD-BEARING. app/main.py imports `from app.health import …`, not
    # `from services.api.app…`, so the process must run with services/api as its working
    # directory. Changing this breaks the import with no other symptom. CI mirrors it with
    # PYTHONPATH=services/api for the same reason.
    rootDir: services/api

    # services/api/requirements.txt delegates to ../../requirements-api.lock — 21 pinned
    # packages, a strict subset of requirements.lock, without vnstock's closure (D-22). The
    # relative path resolves because Render clones the whole repository and rootDir only sets
    # the working directory.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Liveness only, deliberately. /health returns HTTP 200 whenever the process is alive and
    # reports database trouble in the BODY as "database": "error". A health check that failed on
    # a transient Supabase blip would restart-loop the service, turning a read outage into a
    # total one.
    healthCheckPath: /health

    envVars:
      # Arms every guard in app/runtime_guards.py: a structurally invalid DATABASE_URL, a truthy
      # API_DEV_FIXTURES, an over-broad origin pattern, or no origin configuration at all each
      # become a refusal to start.
      - key: ENV
        value: production

      # SECRET — set in the Render dashboard, never here.
      #
      # P15: points at Supabase project qhbfjgheeyckefcwtmcq (ap-southeast-1, Singapore) — the
      # project that was empty at the start of P15 and is now this deployment's target, replacing
      # dxklhenmyzdzitgnmuwc (ap-southeast-2, Sydney). Use the Supabase SESSION POOLER host on
      # port 5432. Two constraints, both easy to get wrong and both silent when wrong:
      #   * the direct db.<ref>.supabase.co endpoint is IPv6-only and Render's egress cannot be
      #     assumed to be, so the pooler is required;
      #   * the TRANSACTION pooler (6543) puts the API's only connection-layer write barrier —
      #     `conn.set_session(readonly=True)` in app/db/connection.py, which issues SET SESSION
      #     CHARACTERISTICS AS TRANSACTION READ ONLY — outside this process's control.
      #
      #     An earlier revision claimed 6543 makes that statement error or leak into another
      #     client's session. MEASURED against this project on 2026-08-29, it does neither:
      #     `set_session` succeeded, and over 20 transactions on ONE client connection served by
      #     8 DISTINCT backends, `transaction_read_only` read `on` every time — Supavisor replays
      #     the session parameter onto whichever backend it assigns. The claim is corrected
      #     rather than deleted, because it was the stated reason for this setting and a reason
      #     that does not reproduce must not go on being cited.
      #
      #     5432 is still required, on the reason that survives measurement. Under session
      #     pooling the read-only characteristic is a property of a session THIS process owns
      #     for the connection's whole life; under transaction pooling it is a property of a
      #     proxy's parameter-replay behaviour, which Supabase does not document as a guarantee
      #     and which no test here can pin. Since D-20 the API connects as `postgres`, so that
      #     characteristic is the only thing standing between a read path and a read-write
      #     superuser session — not a place to depend on undocumented proxy behaviour.
      #
      #     It fails LOUDLY either way: since the read-only pass became fatal in production, a
      #     URL that genuinely could not establish the barrier answers 503 rather than serving
      #     writably. `/health` would still report "database": "ok", because db/ping.py opens its
      #     own connection and never issues the statement.
      - key: DATABASE_URL
        sync: false

      # Fallback only (P15/D2) — the browser's normal path to the API is the static site's
      # same-origin rewrite below, which needs no CORS admission at all. This exists for the case
      # that rewrite does not do (Validation #11 is where that gets proved or disproved): the
      # site's own origin — actual assigned host is https://anchor-model-web-lrgg.onrender.com
      # (Render appended -lrgg since the bare name was taken), comma-separated if more than one.
      # The API will not boot while BOTH this and ALLOWED_ORIGIN_REGEX are empty.
      - key: ALLOWED_ORIGINS
        sync: false

      # Optional and, as of P15, not expected to be needed — it existed for Netlify's
      # per-deploy-preview origins (a different host on every build), and the Render Static Site
      # this dashboard runs on now does not mint one. Left declared, `sync: false`, in case a
      # future preview workflow needs it again; `runtime_guards.is_overbroad_origin_regex`
      # refuses a pattern that admits arbitrary origins.
      - key: ALLOWED_ORIGIN_REGEX
        sync: false

  # ---------------------------------------------------------------------------
  # Dashboard — Next.js static export. Client-rendered throughout (D-13), so nothing here needs
  # a Node server at runtime; only the build itself does.
  # ---------------------------------------------------------------------------
  - type: web
    name: anchor-model-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: out

    routes:
      # Same-origin proxy (P15/D2): the browser calls its own origin, Render forwards to the API
      # service, and the two-provider cross-reference D-21/D-30 needed by hand is gone with it —
      # this file is the only place either service's URL has to be written down. NOT YET VERIFIED
      # against a real Render Static Site (Known risks in the P15 plan); Validation #11 is where
      # that gets checked, with ALLOWED_ORIGINS above as the fallback if it does not hold.
      - type: rewrite
        source: /api/*
        destination: https://anchor-model-api-lrgg.onrender.com/api/*

    envVars:
      # Matches apps/web/.node-version and the CI job, so all three agree on one runtime.
      - key: NODE_VERSION
        value: "22"

      # A fixed value, not the API's URL — apps/web/src/lib/api.ts's validateApiBaseUrl (P15/D2)
      # treats a root-relative value as "same origin" and joinApiUrl resolves it to a bare path.
      # This is what makes the value knowable before either service has been deployed once: it
      # names no host, so there is nothing here for a first deploy to fail to know yet.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /
