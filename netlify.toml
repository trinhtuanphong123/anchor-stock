# Netlify — the half of the deployment Netlify owns.
#
# `render.yaml` declares the API and nothing else; this declares the dashboard and nothing else.
# Each host describes only what it runs, so neither file overstates its reach. The reasoning for
# the split, and for a static host over a web service, is in
# docs/decisions/D-30-hosting-split-across-two-providers.md.
#
# Placed at the repository root rather than in apps/web because Netlify resolves `base` relative
# to the repository root, and a config file that must itself be found relative to `base` is a
# chicken-and-egg the UI resolves differently from the CLI.

[build]
  # `base` makes apps/web the working directory for the build; `publish` is then resolved inside
  # it, which is why it reads "out" and not "apps/web/out".
  base = "apps/web"
  command = "npm ci && npm run build"
  publish = "out"

[build.environment]
  # Matches apps/web/.node-version and the CI job, so all three agree on one runtime. Netlify
  # does not read .node-version from a subdirectory when `base` is set, hence the restatement.
  NODE_VERSION = "22"

# NEXT_PUBLIC_API_BASE_URL IS NOT SET HERE, and the omission is deliberate.
#
# It is BUILD-TIME, not runtime: lib/api.ts reads it as a literal `process.env.…` member
# expression precisely so Next can substitute it into the bundle, and changing it later without
# a rebuild does nothing. It is also mandatory — `next build` sets NODE_ENV=production, which
# classifyRuntimeMode treats as production-like, and a production-like build NEVER falls back to
# mock data. A missing value renders an "api_not_configured" error on every panel: fail-closed
# by design, so a misconfigured deployment looks broken rather than looking real.
#
# Set it in the Netlify UI (Site configuration → Environment variables) and redeploy. It is kept
# out of this file for the same reason render.yaml marks its cross-references `sync: false`: it
# names the other host, which this file cannot resolve, and committing a guess would produce a
# site that builds green and points at nothing.

# apps/web/next.config.ts sets `trailingSlash: true`, so every route already resolves to
# <route>/index.html and deep links work on a static host with no rewrite rule. The only
# redirect needed is the SPA-style 404 fallback Next's export already provides as 404.html,
# which Netlify serves automatically. No [[redirects]] block is required — one added "just in
# case" would shadow the real pages.
