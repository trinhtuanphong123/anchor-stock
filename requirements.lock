# ClusterWeb — authoritative production dependency lock (P14-S02).
#
# Fully pinned (==) transitive closure of requirements.in for BOTH the FastAPI API and the Python
# worker/scheduler/bootstrap. This is what a local all-purpose virtual environment installs:
#
#     python -m pip install --requirement requirements.lock
#
# It is NO LONGER what deployment installs. As of P8 (D-22) services/api builds from
# requirements-api.lock, a 21-package strict subset of this file compiled under
# `--constraint requirements.lock` — so the two agree version for version and the API build stops
# dragging in vnstock's closure. This file stays the canonical source for those shared pins;
# regenerate it first, then requirements-api.lock against it.
#
# Authoritatively generated and verified on **Debian-slim-based Linux x86_64** (python:3.13-slim,
# glibc, cp313 manylinux ABI) via a disposable Docker container — so Linux-only closure (e.g.
# uvloop for uvicorn[standard]) is included and Windows-only packages are excluded. A
# Windows-resolved lock is NOT authoritative. Regenerated 2026-08-18 (P6.0) after correcting the
# vnstock pin below — the prior lock (vnstock==3.5.1) disagreed with the interpreter this repo
# actually runs (4.0.4) and with pipelines/ingestion/provider.py, which was written and probed
# against 4.0.4 specifically.
#
# Regenerate (never hand-edit the pins) after changing requirements.in, in a fresh disposable
# Linux environment with the exact interpreter and the exact ephemeral compiler (never a runtime
# dep):
#     docker run --rm --platform linux/amd64 -v "<repo>:/work" python:3.13-slim bash -c '
#         pip install -q "pip==24.3.1" "pip-tools==7.5.3"
#         python -m piptools compile --resolver=backtracking --no-header \
#             --output-file /work/requirements.lock /work/requirements.in'
# (pip-tools 7.5.3 imports a pip-internal symbol pip>=25 removed, so pip is pinned down for the
# compile step only — the pin does not propagate into this lock file.)
#
# The vnstock closure (matplotlib, seaborn, wordcloud, openpyxl, pillow, ...) is vnstock's own
# mandatory install_requires, NOT a project-chosen analytical library; the surfaced Leiden path is
# pure-numpy. No SciPy/scikit-learn/igraph/leidenalg/K-Means library is present.
